name: Validate

on:
  pull_request:
  push:
    branches-ignore:
      - main
  schedule:
    - cron: "17 3 * * 1"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Home Assistant tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.2"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements_test.txt
      - name: Lint
        run: ruff check custom_components tests
      - name: Test
        run: pytest --cov=custom_components/openevse_control --cov-report=term-missing

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
          # HACS reads repository-level metadata from the default branch. During
          # this initial PR, LICENSE is not on main yet, and this GitHub App cannot
          # edit the repository description. The merged repository does contain
          # LICENSE; only the description remains an external repository setting.
          ignore: description license
