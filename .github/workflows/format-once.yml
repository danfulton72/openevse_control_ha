name: Format once

on:
  push:
    branches:
      - feat/openevse-control-integration

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[ruff-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/openevse-control-integration
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.2"
      - run: python -m pip install ruff
      - name: Apply Ruff fixes
        run: ruff check --fix custom_components tests
      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components tests
          git commit -m "style: apply Ruff fixes [ruff-fixed]"
          git push origin HEAD:feat/openevse-control-integration
